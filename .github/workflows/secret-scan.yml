name: secret-scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks
        run: gitleaks detect --source . --redact --config .gitleaks.toml --verbose
