[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-dev-pipeline"
version = "0.1.0"
description = "Local deterministic orchestrator scaffold for a generic software-dev pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EladAriel" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5"]

[project.scripts]
pipeline = "claude_dev_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/DESIGN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
